<template>
    <div class="bg-linear-180 from-neutral-500/15 to-neutral-700/40 border-t border-t-white/20 border-b border-b-black/60 shadow-xl shadow-black/30 outline -outline-offset-4 outline-stone-200/10 p-8">
        <div class="grid grid-cols-3 gap-8">
            <select name="class" id="class" class="d2rr-select" value.bind="selectedClass" is-empty.class="selectedClass === ''">
                <option repeat.for="opt of classes" value.bind="opt.value">${opt.label}</option>
            </select>
            <select name="type" id="type" class="d2rr-select" value.bind="selectedType" is-empty.class="selectedType === ''">
                <option repeat.for="opt of types" value.bind="opt.value">${opt.label}</option>
            </select>
            <input class="d2rr-input" type="text" placeholder="Search uniques for…" value.bind="search">
            <div class="flex justify-center col-span-full text-4xl font-d2r text-center text-shadow-lg text-shadow-black">
                <h2>Uniques</h2>   
                <span>: ${uniques.length} Found</span>
            </div>
        </div>
    </div>

    <div class="p-8 grid grid-cols-3 2xl:grid-cols-4 gap-8">
        <article repeat.for="unique of uniques" class="bg-black/50 box-shadow-inset-card border border-white/20">
            <header class="text-center p-4">
                <h3 class="font-d2r text-2xl text-diablo-unique">${unique.Name}</h3>
                <span class="text-stone-200/90 italic tracking-wider">${unique.Equipment.Name ?? ''}</span>
            </header>
            <hr class="mx-4 border-t border-t-black border-b border-b-white/15">
            <section class=" p-4 flex flex-col gap-1 text-center">
                <p if.bind="unique.Equipment.ArmorString">
                    Armor: ${unique.Equipment.ArmorString}
                </p>
                <ul if.bind="unique.Equipment.DamageTypes">
                    <li repeat.for="damage of unique.Equipment.DamageTypes">
                        ${getDamageTypeString(damage.Type)} ${damage.DamageString}
                    </li>
                </ul>
                <p if.bind="unique.RequiredLevel > 0" class="text-diablo-requirement">
                    Level ${unique.RequiredLevel} Required
                </p>
                <p if.bind="unique.Equipment.RequiredStrength > 0" class="text-diablo-requirement">
                    Strength Required: ${unique.Equipment.RequiredStrength} 
                </p>
                <p if.bind="unique.Equipment.RequiredDexterity > 0" class="text-diablo-requirement">
                    ${unique.Equipment.RequiredDexterity} Dexterity Required
                </p>
                <p if.bind="unique.Equipment.Durability > 0">
                    Durability: ${unique.Equipment.Durability}
                </p>
                <ul class="mt-2 first:mt-0 text-diablo-magic">
                    <li repeat.for="property of unique.Properties">
                        ${property.PropertyString}
                    </li>
                </ul>
            </section>
        </article>
    </div>
</template>
