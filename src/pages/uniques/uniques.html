<template>
    <h3 class="text-center my-4">
        ${uniques.length} Uniques Found
    </h3>
    <div class="container">
        <div class="row align-content-center justify-content-center text-center mb-5">
            <div class="col-12 col-md-5 col-lg-4">
                <div class="au-select mb-2">
                    <!-- <moo-select
                            class="w-100"
                            label="Select Class"
                            options.bind="classes"
                            class="standard-betsy-select"
                            value.bind="class"
                    ></moo-select> -->
                    <select class="form-select" aria-label="Default select example">
                        <option selected>Select class…</option>
                        <option value="1">One</option>
                        <option value="2">Two</option>
                        <option value="3">Three</option>
                    </select>
                </div>
            </div>
            <div class="col-12 col-md-5 col-lg-4">
                    <select class="form-select" aria-label="Default select example">
                        <option selected>Select type…</option>
                        <option value="1">One</option>
                        <option value="2">Two</option>
                        <option value="3">Three</option>
                    </select>
                <!-- <div class="au-select mb-2">
                    <moo-select
                            class="w-100"
                            label="Select Type"
                            options.bind="types"
                            class="standard-betsy-select"
                            value.bind="selectedType"
                    ></moo-select>
                </div> -->
            </div>
            <div class="col-12 col-md-5 col-lg-4">
                <input class="form-control" type="text" placeholder="Search for uniques…" aria-label="unique items search" value.bind="search">
            </div>
        </div>
        <!-- <hr class="mb-4 bg-dark"> -->
    </div>

    <div class="row gy-5 px-1 px-md-2 px-xl-5 text-center">
        <div class="col-12 col-md-6 col-xxl-4" repeat.for="unique of uniques">
            <div class="card shadow-none bg-dark border-none p-3 m-0">
                <div class="card-title mb-0">
                    <h4 class="unique-text mb-0">${unique.Name}</h4>
                    <p class="description mb-3">${unique.Equipment.Name}</p>
                    <hr class="m-0">
                </div>
                <div class="card-body vstack gap-2">
                    <div class="armor" if.bind="unique.Equipment.ArmorString">
                        Armor: ${unique.Equipment.ArmorString}
                    </div>
                    <ul class="damage list-unstyled mb-0" if.bind="unique.Equipment.DamageTypes">
                        <li repeat.for="damage of unique.Equipment.DamageTypes">
                            ${getDamageTypeString(damage.Type)} ${damage.DamageString}
                        </li>
                    </ul>
                    <ul class="requirement list-unstyled mb-0">
                        <li if.bind="unique.RequiredLevel > 0">
                            Level ${unique.RequiredLevel} Required
                        </li>
                        <li if.bind="unique.Equipment.RequiredStrength > 0">
                            ${unique.Equipment.RequiredStrength} Strength Required
                        </li>
                        <li if.bind="unique.Equipment.RequiredDexterity > 0">
                            ${unique.Equipment.RequiredDexterity} Dexterity Required
                        </li>
                    </ul>
                    <div class="durability" if.bind="unique.Equipment.Durability > 0">
                        ${unique.Equipment.Durability} Durability
                    </div>
                    <ul class="list-unstyled mb-0">
                        <li class="enhanced" repeat.for="property of unique.Properties">
                            ${property.PropertyString}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</template>
